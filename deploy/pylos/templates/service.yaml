apiVersion: v1
kind: Service
metadata:
  name: {{ include "pylos.fullname" . }}
  labels:
    {{- include "pylos.labels" . | nindent 4 }}
spec:
  type: {{ if .Values.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector:
    app.kubernetes.io/name: {{ include "pylos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if .Values.nodePort }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
